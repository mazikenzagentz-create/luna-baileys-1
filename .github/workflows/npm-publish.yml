name: Publish @nerxa/socketon to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'WAProto/**'
      - 'engine-requirements.js'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(npm view "$NAME" version 2>/dev/null || node -p "require('./package.json').version")
          NEXT=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number); console.log([a,b,c+1].join('.'))" "$CURRENT")
          npm pkg set version="$NEXT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$NEXT"
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish summary
        run: echo "Published ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"

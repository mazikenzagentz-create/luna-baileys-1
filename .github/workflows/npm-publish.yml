name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'WAProto/**'
      - 'engine-requirements.js'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm install --ignore-scripts

      - name: Package info
        id: pkg
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Publishing $NAME@$VER"

      - name: Check if version already on npm
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version already published — skip"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version not on npm — will publish"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Done
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "Skipped — ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} already on npm"
          else
            echo "Published ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
            echo "https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}"
          fi
